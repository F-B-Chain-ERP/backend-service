name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      deploy_to_server:
        description: 'Triển khai lên server sau khi build?'
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: erp-backend

jobs:
  # ----------------------------------------------------------------------------
  # JOB 1: Fast Compilation & Packaging Verification (Tối ưu cache, bỏ unit test)
  # ----------------------------------------------------------------------------
  validate:
    name: ⚡ Fast Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend-service
        uses: actions/checkout@v4
        with:
          path: backend-service

      - name: Checkout core-model
        uses: actions/checkout@v4
        with:
          repository: F-B-Chain-ERP/core-model
          ref: dev
          token: ${{ secrets.GH_PAT || github.token }}
          path: core-model
        continue-on-error: true

      # Fallback nếu core-model chưa có branch dev -> checkout main/master
      - name: Checkout core-model (fallback default branch)
        if: steps.checkout-core-model.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: F-B-Chain-ERP/core-model
          token: ${{ secrets.GH_PAT || github.token }}
          path: core-model

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          cache-dependency-path: |
            core-model/pom.xml
            backend-service/pom.xml

      - name: Build & Install core-model
        run: |
          chmod +x backend-service/mvnw
          cd core-model
          ../backend-service/mvnw clean install -DskipTests

      - name: Compile backend-service
        run: |
          cd backend-service
          ./mvnw clean compile -DskipTests -Dcheckstyle.skip=true

  # ----------------------------------------------------------------------------
  # JOB 2: Build Multi-Stage Docker Image & Push to GHCR (GitHub Container Registry)
  # ----------------------------------------------------------------------------
  build-and-push:
    name: 🐳 Docker Build & Push to GHCR
    needs: validate
    if: (github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.vars.outputs.short_sha }}
      image_ref: ${{ steps.vars.outputs.image_ref }}
    steps:
      - name: Set short git SHA & image vars
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          LOWER_REPO=$(echo "${{ github.repository_owner }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "image_ref=${{ env.REGISTRY }}/${LOWER_REPO}" >> $GITHUB_OUTPUT

      - name: Checkout backend-service
        uses: actions/checkout@v4
        with:
          path: backend-service

      - name: Checkout core-model
        uses: actions/checkout@v4
        with:
          repository: F-B-Chain-ERP/core-model
          ref: dev
          token: ${{ secrets.GH_PAT || github.token }}
          path: core-model
        continue-on-error: true

      - name: Checkout core-model (fallback default branch)
        if: steps.checkout-core-model.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          repository: F-B-Chain-ERP/core-model
          token: ${{ secrets.GH_PAT || github.token }}
          path: core-model

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Meta (Generate tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image_ref }}
          tags: |
            type=raw,value=dev
            type=raw,value=sha-${{ steps.vars.outputs.short_sha }}
            type=raw,value=latest

      - name: Build & Push Docker Image (with GitHub Actions Layer Cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend-service/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ----------------------------------------------------------------------------
  # JOB 3: Continuous Deployment & Automated Health Check / Rollback
  # ----------------------------------------------------------------------------
  deploy:
    name: 🚀 Deploy to Server & Health Check
    needs: build-and-push
    if: |
      ((github.event_name == 'push' && github.ref == 'refs/heads/dev') || github.event_name == 'workflow_dispatch') &&
      (github.event.inputs.deploy_to_server != 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Remote Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER || 'root' }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            TARGET_IMAGE="${{ needs.build-and-push.outputs.image_ref }}"
            TARGET_TAG="sha-${{ needs.build-and-push.outputs.short_sha }}"

            echo "=========================================================="
            echo "  SSH DEPLOY TRIGGERED FROM GITHUB ACTIONS"
            echo "  Target: ${TARGET_IMAGE}:${TARGET_TAG}"
            echo "=========================================================="

            REPO_URL="https://x-access-token:${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}@github.com/F-B-Chain-ERP/backend-service.git"

            # Nhận diện đường dẫn thư mục backend-service (ưu tiên ~/backend-service như server hiện tại)
            if [ -d "${HOME}/backend-service" ]; then
              APP_DIR="${HOME}/backend-service"
            elif [ -d "/opt/ERP-UTT/backend-service" ]; then
              APP_DIR="/opt/ERP-UTT/backend-service"
            else
              APP_DIR="${HOME}/backend-service"
              mkdir -p "${APP_DIR}"
            fi

            echo "▶ Server Working Directory: ${APP_DIR}"
            cd "${APP_DIR}"

            # Nếu thư mục chưa khởi tạo git repo -> clone về
            if [ ! -d ".git" ]; then
              echo "▶ Clone backend-service về server..."
              git clone -b dev "${REPO_URL}" .
            fi

            # Đồng bộ các scripts và docker-compose mới nhất từ nhánh dev
            echo "▶ Đồng bộ source files mới nhất..."
            git remote set-url origin "${REPO_URL}"
            git fetch origin dev
            git checkout dev
            git reset --hard origin/dev

            # Cấp quyền thực thi cho các scripts
            chmod +x deploy/scripts/*.sh

            # Đăng nhập GHCR trên server để pull image
            echo "▶ Xác thực GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Chạy deploy script với cơ chế tự động rollback
            bash deploy/scripts/deploy.sh "${TARGET_IMAGE}" "${TARGET_TAG}"

server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:erp_dev}}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:50}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: ${JWT_ACCESS_EXPIRY:2592000}
    refresh-token-expiry: ${JWT_REFRESH_EXPIRY:2592000}
    password-reset-expiry: ${JWT_PASSWORD_RESET_EXPIRY:900}
  rate-limit:
    anonymous:
      capacity: ${RL_ANON_CAPACITY:20}
      refill-tokens: ${RL_ANON_REFILL_TOKENS:20}
      refill-seconds: ${RL_ANON_REFILL_SECONDS:60}
    authenticated:
      capacity: ${RL_AUTH_CAPACITY:100}
      refill-tokens: ${RL_AUTH_REFILL_TOKENS:100}
      refill-seconds: ${RL_AUTH_REFILL_SECONDS:60}
  otp:
    length: 6
    expiry-seconds: 900
    max-attempts: 5
    resend-cooldown-seconds: 60
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket-name: ${MINIO_BUCKET_NAME:erp-products}
    public-url: ${MINIO_PUBLIC_URL:/storage}

logging:
  level:
    com.erp: INFO
    org.springframework.security: WARN
  file:
    name: /var/log/erp/backend-service.log

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name:backend-service}
      env: prod
    distribution:
      percentiles-histogram:
        http.server.requests: true

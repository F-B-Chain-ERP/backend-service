services:
  backend-service:
    image: ${IMAGE_NAME:-erp-backend}:${APP_IMAGE_TAG:-latest}
    container_name: erp-backend
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_URL=jdbc:postgresql://postgresql:5432/erp_dev
      - DB_USERNAME=erp_user
      - DB_PASSWORD=erp123456@
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=erp_redis_2026
      - JWT_SECRET=ZGV2LW9ubHktc2VjcmV0LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy1mb3ItaG1hYw==
    ports:
      - "8080:8080"
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  postgresql:
    extends:
      file: postgresql.yml
      service: postgresql

  redis:
    extends:
      file: redis.yml
      service: redis

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

services:
  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    container_name: erp-minio
    restart: unless-stopped
    ports:
      - "9000:9000"              # S3 API
      - "127.0.0.1:9001:9001"    # Web Console (chỉ mở nội bộ localhost/reverse proxy)
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: erp_minio
      MINIO_ROOT_PASSWORD: erp123456@
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  minio_data:
    driver: local
services:
  postgresql:
    extends:
      file: postgresql.yml
      service: postgresql

  redis:
    extends:
      file: redis.yml
      service: redis

  minio:
    extends:
      file: minio.yml
      service: minio

  rabbitmq:
    extends:
      file: rabbitmq.yml
      service: rabbitmq

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  rabbitmq_data:
    driver: local

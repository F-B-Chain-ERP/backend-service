services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: erp-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"        # AMQP protocol
      - "15672:15672"      # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: erp_rabbit
      RABBITMQ_DEFAULT_PASS: erp123456@
      RABBITMQ_DEFAULT_VHOST: erp_vhost
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  rabbitmq_data:
    driver: local

spring:
  application:
    name: backend-service
    version: "@project.version@"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  banner:
    charset: UTF-8
    location: classpath:banner.txt
  jpa:
    properties:
      # Gộp nhiều INSERT/UPDATE thành batch, giảm số lượt gọi DB (đặc biệt saveAll hàng loạt)
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true
      hibernate.order_updates: true
  output:
    ansi:
      enabled: always
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:dohoan25112004@gmail.com}
    password: ${MAIL_PASSWORD:dxbu jqon lyrt tckw}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

app:
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LW11c3QtYmUtYXQtbGVhc3QtMjU2LWJpdHMtbG9uZy1mb3ItaG1hYw==}
    access-token-expiry: ${JWT_ACCESS_EXPIRY:900}
    refresh-token-expiry: ${JWT_REFRESH_EXPIRY:604800}
    password-reset-expiry: ${JWT_PASSWORD_RESET_EXPIRY:900}
  oauth2:
    google:
      # Public OAuth2 client id (dùng cho Google Sign-In ở phía client).
      # Đây là giá trị công khai, không phải bí mật.
      client-id: ${GOOGLE_CLIENT_ID:515184634950-2loffnaqt1bba24du6fmrhdpv795roce.apps.googleusercontent.com}
  mail:
    enabled: ${EMAIL_ENABLED:true}
    from: ${EMAIL_FROM:dohoan25112004@gmail.com}
    from-name: "${EMAIL_FROM_NAME:Dịch vụ Đồ uống & Cà phê}"
  otp:
    length: ${OTP_LENGTH:6}
    expiry-seconds: ${OTP_EXPIRY_SECONDS:900}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    resend-cooldown-seconds: ${OTP_RESEND_COOLDOWN:60}
  rate-limit:
    anonymous:
      capacity: ${RL_ANON_CAPACITY:20}
      refill-tokens: ${RL_ANON_REFILL:20}
      refill-seconds: ${RL_ANON_PERIOD:60}
    authenticated:
      capacity: ${RL_AUTH_CAPACITY:100}
      refill-tokens: ${RL_AUTH_REFILL:100}
      refill-seconds: ${RL_AUTH_PERIOD:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    prometheus:
      enabled: true

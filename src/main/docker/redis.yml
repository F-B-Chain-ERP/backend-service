services:
  redis:
    image: redis:7-alpine
    container_name: erp-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "erp_redis_2026", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "erp_redis_2026", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
    driver: local
